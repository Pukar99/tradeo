name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    name: Lint + Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Security audit (production deps — fail on high/critical)
        # Gates what actually ships to users. Dev/build-only advisories
        # (vite/esbuild, blocknote/uuid) are tracked separately and surfaced
        # by the next step without failing the build.
        run: npm audit --omit=dev --audit-level=high

      - name: Security audit (full — report only, non-blocking)
        run: npm audit || true

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
