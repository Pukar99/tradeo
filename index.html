<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-light.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tradeo</title>

    <style>
      /* Push Google Translate widget off-screen — must exist in DOM for cookie-based translate to work */
      #google_translate_element {
        position: absolute;
        top: -9999px;
        left: -9999px;
        visibility: hidden;
      }
      /* Kill every Google Translate UI element */
      .goog-te-banner-frame,
      .goog-te-banner-frame.skiptranslate,
      #goog-gt-tt,
      .goog-te-balloon-frame,
      .goog-te-ftab-float,
      .goog-te-menu-frame,
      iframe.skiptranslate {
        display: none !important;
        visibility: hidden !important;
        height: 0 !important;
        pointer-events: none !important;
      }
      /* Google Translate shifts body.style.top to make room for its banner.
         Counter it immediately at the CSS level so layout never jumps.
         The JS override below also sets it inline for belt-and-suspenders. */
      body {
        top: 0px !important;
        position: static !important;
        min-height: 100% !important;
      }
      /* Remove yellow highlight on translated text */
      .goog-text-highlight {
        background: none !important;
        box-shadow: none !important;
      }
    </style>

    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          {
            pageLanguage: 'en',
            includedLanguages: 'ne,en',
            autoDisplay: false,
          },
          'google_translate_element'
        )
      }
    </script>
    <script type="text/javascript"
      src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit">
    </script>

    <script>
      // Google Translate sets body.style.top to a negative value to make room
      // for its toolbar. We reset it immediately via MutationObserver so the
      // page layout never shifts and navbar click targets stay correct.
      var gtObserver = new MutationObserver(function() {
        if (document.body && document.body.style.top && document.body.style.top !== '0px') {
          document.body.style.top = '0px'
        }
        document.querySelectorAll('iframe.skiptranslate, .goog-te-banner-frame').forEach(function(el) {
          el.style.display = 'none'
          el.style.visibility = 'hidden'
        })
      })
      gtObserver.observe(document.body, { attributes: true, attributeFilter: ['style'] })
      gtObserver.observe(document.documentElement, { childList: true, subtree: true })
    </script>
  </head>
  <body translate="no">
    <!-- Google Translate mount — kept in DOM but hidden off-screen -->
    <div id="google_translate_element"></div>

    <div id="root" translate="no"></div>
    <!-- Portal target for modals/menus — outside #root but still translate=no -->
    <div id="portal-root" translate="no"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
